[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-morning-brief"
version = "1.0.0"
description = "Generate a local, dated morning brief from public RSS feeds."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[project.scripts]
scout-morning = "scout_morning.cli:main"

[tool.setuptools]
packages = ["scout_morning"]
